<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; font-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
  <title>BetterDungeon — Store artwork</title>
  <style>/*__STYLES__*/</style>
</head>
<body>
  <main class="artboard">
    <header class="brand"><img class="brand-mark" alt=""><span class="wordmark">Better<span>Dungeon</span></span></header>
    <div class="eyebrow"></div>
    <section class="copy"><h1></h1><p class="description"></p><ul class="bullets"></ul><p class="cta"></p></section>
    <section class="visual" aria-label="BetterDungeon screenshots"></section>
  </main>
  <script>
    // The export script supplies local-only content; this page is not shipped with the extension.
    const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('/*__DATA__*/'), c => c.charCodeAt(0))));
    document.documentElement.style.setProperty('--canvas-width', `${data.width}px`);
    document.documentElement.style.setProperty('--canvas-height', `${data.height}px`);
    document.body.className = data.kind;
    document.querySelector('.brand-mark').src = data.brandMark;
    if (data.kind === 'screenshot') {
      // Lucide icon paths (ISC license, lucide.dev)
      const ICONS = {
        'bot': '<rect width="18" height="10" x="3" y="11" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" x2="8" y1="16" y2="16"/><line x1="16" x2="16" y1="16" y2="16"/>',
        'gamepad-2': '<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>',
        'layers': '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
        'wrench': '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
        'zap': '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        'sparkles': '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>',
        'rocket': '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>'
      };
      const iconSvg = name => ICONS[name]
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`
        : '';
      document.querySelector('.artboard').dataset.layout = data.layout;
      const eyebrow = document.querySelector('.eyebrow');
      if (data.eyebrow) eyebrow.textContent = data.eyebrow;
      else eyebrow.remove();
      const headline = document.querySelector('h1');
      if (data.highlight && data.headline.includes(data.highlight)) {
        const [before, after] = data.headline.split(data.highlight);
        headline.append(document.createTextNode(before));
        const accent = document.createElement('span');
        accent.className = 'accent';
        accent.textContent = data.highlight;
        headline.append(accent, document.createTextNode(after));
      } else {
        headline.textContent = data.headline;
      }
      document.querySelector('.description').textContent = data.description;
      if (!data.description) document.querySelector('.description').remove();
      for (const bullet of data.bullets) {
        const item = document.createElement('li');
        item.textContent = bullet;
        document.querySelector('.bullets').append(item);
      }
      if (!data.bullets.length) document.querySelector('.bullets').remove();
      const cta = document.querySelector('.cta');
      if (data.cta) cta.textContent = data.cta;
      else cta.remove();
      if (data.chips && data.chips.length) {
        const groups = document.createElement('div');
        groups.className = 'chip-groups';
        for (const group of data.chips) {
          const groupEl = document.createElement('div');
          groupEl.className = 'chip-group';
          if (group.group) {
            const header = document.createElement('div');
            header.className = 'chip-group-header';
            if (group.icon && ICONS[group.icon]) {
              const icon = document.createElement('span');
              icon.className = 'chip-group-icon';
              icon.innerHTML = iconSvg(group.icon);
              header.append(icon);
            }
            const label = document.createElement('span');
            label.className = 'chip-group-label';
            label.textContent = group.group;
            header.append(label);
            groupEl.append(header);
          }
          const chips = document.createElement('div');
          chips.className = 'chips';
          for (const item of group.items) {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = item;
            chips.append(chip);
          }
          groupEl.append(chips);
          groups.append(groupEl);
        }
        document.querySelector('.copy').insertBefore(groups, cta.isConnected ? cta : null);
      }
      if (data.features && data.features.length) {
        const grid = document.createElement('div');
        grid.className = 'features';
        for (const feature of data.features) {
          const card = document.createElement('div');
          card.className = feature.featured ? 'feature featured' : 'feature';
          if (feature.icon && ICONS[feature.icon]) {
            const icon = document.createElement('div');
            icon.className = 'feature-icon';
            icon.innerHTML = iconSvg(feature.icon);
            card.append(icon);
          }
          const title = document.createElement('strong');
          title.textContent = feature.title;
          const blurb = document.createElement('span');
          blurb.textContent = feature.blurb;
          card.append(title, blurb);
          if (feature.featured) {
            const badge = document.createElement('em');
            badge.className = 'feature-badge';
            badge.textContent = 'Flagship';
            card.append(badge);
          }
          grid.append(card);
        }
        document.querySelector('.copy').insertBefore(grid, cta.isConnected ? cta : null);
      }
      for (const capture of data.captures) {
        const figure = document.createElement('figure');
        figure.className = 'capture';
        if (capture.chrome !== false) {
          const bar = document.createElement('div');
          bar.className = 'capture-bar';
          const dots = document.createElement('span');
          dots.className = 'capture-dots';
          dots.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
          const title = document.createElement('span');
          title.className = 'capture-title';
          title.textContent = capture.label;
          bar.append(dots, title);
          figure.append(bar);
        }
        const viewport = document.createElement('div');
        viewport.className = 'capture-window';
        const image = document.createElement('img');
        image.src = capture.path;
        image.alt = capture.label;
        const caption = document.createElement('figcaption');
        caption.textContent = capture.label;
        viewport.append(image);
        figure.append(viewport, caption);
        document.querySelector('.visual').append(figure);
      }
    } else {
      document.querySelector('.eyebrow').remove();
      document.querySelector('.copy').remove();
      document.querySelector('.visual').remove();
      if (data.kind === 'marquee') {
        const tagline = document.createElement('div');
        tagline.className = 'tagline';
        tagline.textContent = 'More from every adventure';
        document.querySelector('.artboard').append(tagline);
      }
    }
    const font = new FontFace('IBM Plex Sans', `url("${data.font}")`, { weight: '100 700' });
    document.fonts.add(font);
    Promise.all([font.load(), ...Array.from(document.images, image => image.decode())])
      .then(() => document.documentElement.dataset.ready = 'true');
  </script>
</body>
</html>
