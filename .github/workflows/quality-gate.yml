name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Optional commit to validate instead of the dispatch commit
        required: false
        type: string
  workflow_call:
    inputs:
      target_sha:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

env:
  CHECKOUT_REF: ${{ inputs.target_sha || github.event.inputs.target_sha || github.sha }}

jobs:
  node-contracts:
    name: Node contracts
    runs-on: windows-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run contract and policy tests
        shell: pwsh
        run: .\build.ps1 test

  extension-package:
    name: Extension package
    runs-on: windows-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Build and verify extension ZIP
        shell: pwsh
        run: .\build.ps1 extension
      - name: Upload extension ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BetterDungeon-extension-${{ env.CHECKOUT_REF }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  android-verification:
    name: Android verification
    runs-on: windows-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: Use JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install declared Android platform
        shell: pwsh
        run: sdkmanager "platforms;android-36.1"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Run Android unit tests and assemble debug APK
        shell: pwsh
        run: .\build.ps1 android
      - name: Verify generated Android asset composition
        shell: pwsh
        run: node --test tests/unit/repository-policy.test.js
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BetterDungeon-Android-debug-${{ env.CHECKOUT_REF }}
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14
